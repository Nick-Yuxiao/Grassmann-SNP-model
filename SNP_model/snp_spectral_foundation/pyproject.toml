[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snp-spectral-foundation"
version = "0.1.0"
description = "Gated prototype for local genotype pretraining and spectral block memory"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

